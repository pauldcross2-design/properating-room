<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Properating Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#f3eee2;--court:#fffdf7;--navy:#fffaf1;--raised:#fff8ea;--panel:#f7f1e4;
  --ivory:#1c1914;--mute:#5b564c;--faint:#8a8478;
  --gold:#b0892d;--goldhi:#6e5424;--pine:#4f7a3e;--ice:#3a6d93;--brick:#b45a4a;--amber:#c27a2a;
  --line:rgba(40,32,18,.14);--strong:rgba(40,32,18,.28);--flood:rgba(176,137,45,.14);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--ivory);font-family:"IBM Plex Sans",sans-serif}
body{background:radial-gradient(ellipse 50% 28% at 12% -8%, rgba(176,137,45,.10), transparent 70%),linear-gradient(180deg,#f7f2e6 0%,#f3eee2 46%,#efe8d8 100%);min-height:100vh}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:88rem;margin:0 auto;padding:0 20px 72px}
header.top{padding:18px 20px 8px}
.top-inner{max-width:88rem;margin:0 auto;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.brand h1{margin:0;font-size:28px;letter-spacing:-.04em;font-weight:700;color:#5c4318}
.brand p{margin:4px 0 0;color:var(--mute);font-size:13px}
.meta{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.meta b{color:var(--ivory);font-weight:600}
.sports{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#fffdf8;border:1px solid var(--line);border-radius:14px;padding:6px;margin-top:14px}
.sport{background:transparent;border:0;color:var(--mute);border-radius:10px;padding:10px 8px;min-height:52px}
.sport small{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-top:3px;color:var(--faint)}
.sport.on{background:#efe4c8;color:#1c1914}
.sport.on small{color:#8a6a2f}
.deskbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:18px 0 12px}
.deskbar h2{margin:0;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#8a6a2f;font-family:"IBM Plex Mono",monospace}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:#fffdf8;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:40px;font-size:13px}
.tab.on{background:#c4a046;color:#1c1408;border-color:#c4a046;font-weight:600}
.banner,.card,section.block{background:#fffdf8;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.banner{margin-bottom:14px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between}
.banner p,.lede,.sub,.why{color:var(--mute);font-size:14px;margin:0}
.lede{margin:0 0 12px;max-width:92ch;line-height:1.45}
.why{margin-top:8px;font-size:12px;line-height:1.45}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}
.kpi{background:#f7f1e4;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:20px;color:#5c4318;font-variant-numeric:tabular-nums}
.kpi span{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.chip-gold{background:#f3e3b0;color:#6e5424}.chip-pine{background:#d7e8c8;color:#2f5a28}.chip-ice{background:#d4e4f2;color:#2a5578}.chip-brick{background:#f3d4cc;color:#8a3328}.chip-amber{background:#f4dfb8;color:#8a5a18}.chip-mute{background:#efe8d8;color:#5b564c}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
input[type=search],select,input[type=text],input[type=number]{background:#fff;border:1px solid var(--strong);color:#1c1914;border-radius:10px;padding:8px 10px;min-height:40px;font:inherit}
.grid{display:grid;gap:10px}.g6{grid-template-columns:repeat(6,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fffdf8}
th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:500;padding:8px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
td{padding:9px 8px;border-bottom:1px solid rgba(40,32,18,.08);vertical-align:middle}
tr:hover td{background:rgba(196,160,70,.10)}
.name-btn,.linkish{background:none;border:0;padding:0;color:#6e5424;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.heat{display:inline-block;min-width:36px;text-align:center;border-radius:6px;padding:2px 6px;font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.h-g{background:#7dae4a;color:#102008}.h-y{background:#e8c547;color:#1c1408}.h-o{background:#e0893c;color:#fff}.h-r{background:#c45c4a;color:#fff}
.empty{color:var(--mute);padding:18px 8px;text-align:center}
.modal-back{position:fixed;inset:0;background:rgba(40,32,18,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.hidden{display:none!important}
.player-card{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fffdf8;border-radius:16px;border:1px solid var(--strong);padding:18px}
.player-card h2{margin:0;color:#5c4318}
.xbtn{background:#efe4c8;border:1px solid var(--line);color:#1c1914;border-radius:999px;width:36px;height:36px}
.gate{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--faint);display:inline-block}
.dot.on{background:var(--pine)}.dot.wait{background:var(--amber)}
.check li{margin:0 0 6px;color:var(--mute)}
.check .ok{color:#2f5a28}.check .no{color:#8a3328}.check .wait{color:#8a5a18}
.ticket{border:1px dashed var(--strong);border-radius:10px;padding:10px;min-height:88px;background:#fff}
.muted{color:var(--faint);font-size:12px}.warn{color:#8a3328}.ok{color:#2f5a28}
.bo{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--mute)}
footer.foot{margin-top:22px;color:var(--faint);font-size:12px;font-family:"IBM Plex Mono",monospace;letter-spacing:.08em}
@media(max-width:1100px){.kpis,.g6{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.kpis,.g6,.g3,.g2,.g4,.sports{grid-template-columns:1fr 1fr}.meta{text-align:left}}
@media(max-width:520px){.kpis,.g6,.g3,.g2,.g4,.sports{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1>The Properating Room</h1>
      <p>Consensus factory · automated slate first · no invented names · A+ stays isolated</p>
    </div>
    <div class="meta">
      <div>Slate <b>Tue 9/22</b></div>
      <div>As of <b>4:20 PM CT</b></div>
      <div>Persist <b>922-light-v2</b></div>
    </div>
  </div>
  <div class="wrap" style="padding-bottom:0"><nav class="sports" id="sports"></nav></div>
</header>
<div class="wrap">
  <div class="deskbar"><h2 id="deskTitle">Home Run Desk</h2><div class="tabs" id="tabs"></div></div>
  <div class="banner" id="banner"></div>
  <div class="kpis" id="kpis"></div>
  <main id="main"><section class="block"><p class="muted">Loading full desk…</p></section></main>
  <footer class="foot">9/22 close · persist 922-light-v2 · same board as the kitchen preview · A+ and 2-src pinned</footer>
</div>
<div class="modal-back hidden" id="playerModal"></div>
<script>
(async function(){
  const box=document.getElementById('main');
  try{
    const n=9;
    const parts=await Promise.all(Array.from({length:n},function(_,i){
      return fetch('pack'+(i+1)+'.js?d=922v2').then(function(r){
        if(!r.ok) throw new Error('missing pack'+(i+1)+' ('+r.status+')');
        return r.text();
      });
    }));
    const b64=parts.join('').replace(/\s+/g,'');
    const bin=atob(b64);
    const bytes=Uint8Array.from(bin, function(c){ return c.charCodeAt(0); });
    const text=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    const s=document.createElement('script');
    s.textContent=text;
    document.body.appendChild(s);
  }catch(e){
    if(box) box.innerHTML='<section class="block"><p class="warn">Desk failed to load: '+String(e.message||e)+'. Hard-refresh this same URL.</p></section>';
    console.error(e);
  }
})();
</script>
</body>
</html>
